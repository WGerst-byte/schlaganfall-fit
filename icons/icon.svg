<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Hintergrund mit weichen Rundungen -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Weißer innerer Schildkreis -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.12" />

  <!-- Stützende Hände & Vitalitäts-Herz -->
  <g transform="translate(256, 260) scale(1.4)">
    <!-- Schützende Handflügel links und rechts -->
    <!-- Herz in der Mitte -->
    <path d="M 0,-40 C -15,-70 -55,-65 -55,-30 C -55,-5 -20,20 0,45 C 20,20 55,-5 55,-30 C 55,-65 15,-70 0,-40 Z" fill="url(#heartGrad)" stroke="#ffffff" stroke-width="6" />

    <!-- Schützende stützende Hände von unten -->
    <path d="M -75,30 C -60,65 -20,80 0,80 C 20,80 60,65 75,30" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <path d="M -85,15 C -85,35 -50,60 0,60 C 50,60 85,35 85,15" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" />
    
    <!-- Sanfter Reha-Impuls Stern -->
    <circle cx="0" cy="-28" r="7" fill="#ffffff" />
  </g>
</svg>
